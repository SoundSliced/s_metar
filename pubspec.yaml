name: s_metar
description: A Flutter/Dart package for parsing METAR and TAF aeronautical weather reports. Provides full decoding of wind, visibility, weather, clouds, temperature, pressure, runway range, sea state, and TAF change forecasts.
license: MIT
publish_to: none
issue_tracker: https://github.com/SoundSliced/s_metar/issues
repository: https://github.com/SoundSliced/s_metar
version: 1.0.0
homepage: https://github.com/SoundSliced/s_metar

topics:
  - aviation
  - weather
  - metar
  - taf
  - meteorology

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  s_packages: ^1.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
